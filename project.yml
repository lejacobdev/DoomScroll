# XcodeGen spec. The .xcodeproj is generated, never committed:
#   brew install xcodegen && xcodegen generate && open DoomScroll.xcodeproj
name: DoomScroll

options:
  bundleIdPrefix: dev.lejacob
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ScrollCore:
    path: Packages/ScrollCore

targets:
  DoomScroll:
    type: application
    platform: iOS
    sources:
      - Sources/iOS
      - path: Resources/iOS
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: ScrollCore
      - target: DoomScrollWatch
        embed: true
    info:
      path: Resources/iOS/Info.plist
      properties:
        CFBundleDisplayName: DoomScroll
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: DoomScroll uses the camera only to scan the pairing code shown on your Mac.
        NSLocalNetworkUsageDescription: DoomScroll connects to your Mac on your local network to scroll it from your Apple Watch.
        NSBonjourServices: [_doomscroll._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DOOMSCROLL_BUNDLE_PREFIX)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

  DoomScrollWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/Watch
      - path: Resources/Watch
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: ScrollCore
    info:
      path: Resources/Watch/Info.plist
      properties:
        CFBundleDisplayName: DoomScroll
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(DOOMSCROLL_BUNDLE_PREFIX)
        WKBackgroundModes: [workout-processing]
        NSLocalNetworkUsageDescription: DoomScroll connects to your Mac on your local network to scroll it from your wrist.
        NSBonjourServices: [_doomscroll._tcp]
        NSHealthShareUsageDescription: DoomScroll starts a workout session only to keep scrolling responsive while your wrist is down. No health data is read.
        NSHealthUpdateUsageDescription: DoomScroll starts a workout session only to keep scrolling responsive while your wrist is down. No workout is saved.
    entitlements:
      path: Resources/Watch/DoomScrollWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DOOMSCROLL_BUNDLE_PREFIX).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  DoomScrollMac:
    type: application
    platform: macOS
    sources:
      - Sources/Mac
      - path: Resources/Mac
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: ScrollCore
    info:
      path: Resources/Mac/Info.plist
      properties:
        CFBundleDisplayName: DoomScroll
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: DoomScroll listens on your local network for scroll commands from your paired iPhone and Apple Watch.
        NSBonjourServices: [_doomscroll._tcp]
    entitlements:
      path: Resources/Mac/DoomScrollMac.entitlements
      properties:
        # Deliberately NOT sandboxed: posting scroll events into other apps is
        # impossible from the App Sandbox. Distributed via Developer ID + notarization.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DOOMSCROLL_BUNDLE_PREFIX).mac
        PRODUCT_NAME: DoomScroll
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  DoomScroll:
    build:
      targets:
        DoomScroll: all
        DoomScrollWatch: all
    run:
      config: Debug
    archive:
      config: Release
  DoomScrollMac:
    build:
      targets:
        DoomScrollMac: all
    run:
      config: Debug
    archive:
      config: Release
