# XcodeGen spec — the .xcodeproj is generated in CI (and never committed) by:
#   xcodegen generate
# This is what makes the repo buildable without anyone hand-maintaining an
# Xcode project on a Mac.
name: DoomScroll

options:
  bundleIdPrefix: dev.lejacob
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    # CI builds unsigned; AltStore/SideStore re-sign at install time with the
    # user's free Apple ID.
    CODE_SIGN_STYLE: Automatic

targets:
  DoomScroll:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/iOS
      - Sources/Shared
    dependencies:
      # XcodeGen embeds a watchOS application dependency into the iOS app's
      # Watch/ folder automatically (the "Embed Watch Content" phase).
      - target: DoomScrollWatch
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: DoomScroll
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lejacob.doomscroll
        TARGETED_DEVICE_FAMILY: "1"

  DoomScrollWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Sources/Watch
      - Sources/Shared
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: DoomScroll
        # Marks this as a single-target watchOS app paired to the iOS app.
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.lejacob.doomscroll
        NSMotionUsageDescription: >-
          DoomScroll reads wrist motion to detect double taps and tilt
          for air scrolling.
    settings:
      base:
        # Must be prefixed by the companion iOS bundle ID for pairing to work.
        # NOTE: sideloaders that remap bundle IDs break this link — see
        # docs/LIMITATIONS.md.
        PRODUCT_BUNDLE_IDENTIFIER: dev.lejacob.doomscroll.watchkitapp
