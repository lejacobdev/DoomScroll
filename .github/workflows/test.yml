# Runs on every PR and push: fast feedback with no signing required.
name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ScrollCore unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/ScrollCore

  build-simulators:
    name: Build for Simulator (no signing)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iPhone app
        run: |
          xcodebuild build \
            -project DoomScroll.xcodeproj -scheme DoomScroll -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Watch app (standalone scheme while detached from the iPhone app)
        run: |
          xcodebuild build \
            -project DoomScroll.xcodeproj -scheme DoomScrollWatch -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Mac app
        run: |
          xcodebuild build \
            -project DoomScroll.xcodeproj -scheme DoomScrollMac -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
