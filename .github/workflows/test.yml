# PR validation: generates the project and compiles both targets for the
# simulator. Faster than a device build and catches Swift errors without
# needing any signing.
name: Validate build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project DoomScroll.xcodeproj \
            -scheme DoomScroll \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
