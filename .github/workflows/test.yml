# Runs on every PR and push: fast feedback with no signing required.
name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ScrollCore unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/ScrollCore

  build-simulators:
    name: Build for Simulator (no signing)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iOS + watchOS app (embedded)
        run: |
          xcodebuild build \
            -project DoomScroll.xcodeproj -scheme DoomScroll -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify the Watch app is embedded in the iPhone app
        run: |
          APP=$(find build/Build/Products -name DoomScroll.app -path '*iphonesimulator*' | head -1)
          test -n "$APP" && ls "$APP/Watch/"*.app
      - name: Build Mac app
        run: |
          xcodebuild build \
            -project DoomScroll.xcodeproj -scheme DoomScrollMac -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
