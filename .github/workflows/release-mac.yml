# Builds the Mac menu-bar app, signs it with a Developer ID certificate,
# notarizes it with Apple, staples the ticket, and attaches the notarized
# .zip to a GitHub Release. This is the unsandboxed build; the sandboxed
# TestFlight build is release-mac-testflight.yml. Requires repository
# secrets — see docs/RELEASE.md.
name: Release Mac app

on:
  push:
    tags: ["mac-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-notarize:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - run: brew install xcodegen

      - name: Write Config/Local.xcconfig from secrets
        run: |
          cat > Config/Local.xcconfig <<EOT
          DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}
          DOOMSCROLL_BUNDLE_PREFIX = ${{ vars.DOOMSCROLL_BUNDLE_PREFIX }}
          EOT

      - run: xcodegen generate

      - name: Import Developer ID certificate into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=ci-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm cert.p12

      - name: Archive
        run: |
          xcodebuild archive \
            -project DoomScroll.xcodeproj -scheme DoomScrollMac -configuration Release \
            -destination 'platform=macOS' -archivePath build/DoomScrollMac.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Export
        run: |
          cat > ExportOptionsMac.plist <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOT
          xcodebuild -exportArchive \
            -archivePath build/DoomScrollMac.xcarchive \
            -exportOptionsPlist ExportOptionsMac.plist \
            -exportPath build/export

      - name: Zip for notarization
        run: |
          cd build/export
          ditto -c -k --keepParent DoomScroll.app DoomScroll.zip

      - name: Notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 -d > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun notarytool submit build/export/DoomScroll.zip \
            --key ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait
          rm -rf ~/private_keys

      - name: Staple & re-zip
        run: |
          xcrun stapler staple build/export/DoomScroll.app
          cd build/export
          ditto -c -k --keepParent DoomScroll.app DoomScroll-notarized.zip

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain ci-signing.keychain-db || true

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/export/DoomScroll-notarized.zip
          draft: false

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DoomScroll-mac-notarized
          path: build/export/DoomScroll-notarized.zip
