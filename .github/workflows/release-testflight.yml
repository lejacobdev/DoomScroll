# Archives the iOS app (with the embedded watchOS app) and uploads straight
# to App Store Connect / TestFlight. Needs a paid Apple Developer Program
# account. Requires repository secrets — see docs/RELEASE.md.
name: Release to TestFlight

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:

jobs:
  upload:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - run: brew install xcodegen

      - name: Write Config/Local.xcconfig from secrets
        run: |
          cat > Config/Local.xcconfig <<EOT
          DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}
          DOOMSCROLL_BUNDLE_PREFIX = ${{ vars.DOOMSCROLL_BUNDLE_PREFIX }}
          EOT

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 -d > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive (automatic signing via App Store Connect API)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project DoomScroll.xcodeproj -scheme DoomScroll -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/DoomScroll.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export & upload directly to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOT
          xcodebuild -exportArchive \
            -archivePath build/DoomScroll.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up API key
        if: always()
        run: rm -rf ~/private_keys

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build/export/*.log
          if-no-files-found: ignore
