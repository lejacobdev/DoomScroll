# Builds the iOS app with its embedded watchOS companion into an UNSIGNED
# .ipa, with zero secrets required.
#
# "No Mac required" works because GitHub-hosted macOS runners are free for
# public repositories — you never own or touch a Mac; GitHub does. This is the
# only toolchain that can compile watchOS today: xtool (Linux) supports iOS
# only and requires a user-supplied Apple SDK, so it is offered as a separate
# experimental job below, not the primary path.
#
# The .ipa is unsigned on purpose: AltStore / SideStore sign apps with YOUR
# free Apple ID on-device at install time, which is the only signing flow that
# works without a paid Developer Program membership. Shipping certificates
# through CI secrets is unnecessary for this use case.
name: Build iOS + watchOS (.ipa)

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_xtool_experiment:
        description: "Also run the experimental Linux/xtool job (iOS target only)"
        type: boolean
        default: false

env:
  IOS_DEPLOYMENT_TARGET: "17.0"
  WATCHOS_DEPLOYMENT_TARGET: "10.0"

jobs:
  build-ipa:
    name: Build unsigned .ipa (hosted macOS runner)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app (embeds watchOS app, signing disabled)
        run: |
          xcodebuild build \
            -project DoomScroll.xcodeproj \
            -scheme DoomScroll \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/DoomScroll.app"
          test -d "$APP_PATH/Watch" && echo "Watch app embedded OK" || echo "WARNING: no embedded Watch app found"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry DoomScroll-unsigned.ipa Payload
          rm -rf Payload
          ls -lh DoomScroll-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoomScroll-sideload
          path: DoomScroll-unsigned.ipa
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DoomScroll-unsigned.ipa
          draft: false

      - name: Build status
        if: always()
        run: |
          echo "Build status: ${{ job.status }}"
          echo "Download the .ipa from this run's Artifacts, then sideload with AltStore/SideStore."

  # Experimental: xtool on Linux. Honest constraints, baked into the job:
  #  - xtool CANNOT build watchOS targets, so this compiles the iOS app only
  #    (no Watch companion in the output).
  #  - The Apple SDK cannot be redistributed; you must provide a link to a
  #    Xcode .xip you downloaded with your own Apple ID, via the XCODE_XIP_URL
  #    secret, or the job stops after verifying the toolchain image builds.
  xtool-linux-experimental:
    name: "Experimental: xtool on Linux (iOS only)"
    if: github.event_name == 'workflow_dispatch' && inputs.run_xtool_experiment
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build xtool toolchain image
        run: docker build -t doomscroll-xtool .

      - name: Attempt iOS build via xtool
        env:
          XCODE_XIP_URL: ${{ secrets.XCODE_XIP_URL }}
        run: |
          if [ -z "$XCODE_XIP_URL" ]; then
            echo "XCODE_XIP_URL secret not set."
            echo "xtool needs the Apple SDK extracted from an Xcode .xip, which"
            echo "cannot legally ship inside a public Docker image. Set the secret"
            echo "to a private URL of a Xcode .xip downloaded with your Apple ID"
            echo "to let this job run 'xtool setup' and build the iOS target."
            exit 0
          fi
          docker run --rm -e XCODE_XIP_URL doomscroll-xtool ./Build.sh
